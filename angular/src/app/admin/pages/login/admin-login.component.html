<div class="admin-login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Admin Login</h2>
      <p class="text-muted">PearlOfLife Admin Panel</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          formControlName="email"
          placeholder="admin@pearloflife.com"
          [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <div
          class="invalid-feedback"
          *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
          Please enter a valid email
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            class="form-control"
            formControlName="password"
            placeholder="Enter password"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <span class="input-group-text" style="cursor: pointer;" (click)="showPassword = !showPassword">
            <img
              width="24"
              [src]="
                showPassword
                  ? '../../../../assets/icons/form/eye-show.svg'
                  : '../../../../assets/icons/form/eye-hide.svg'
              "
            />
          </span>
        </div>
        <div
          class="invalid-feedback"
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
          Password is required
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="loginForm.invalid || loading"
      >
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading">
          <span class="spinner-border spinner-border-sm me-2"></span>Logging in...
        </span>
      </button>
    </form>

    <div class="login-footer mt-3">
      <p class="text-muted small">
        Default: admin@pearloflife.com / Admin@123
      </p>
    </div>
  </div>
</div>
